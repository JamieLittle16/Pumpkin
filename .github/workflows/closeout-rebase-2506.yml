name: Closeout rebase 2506

on:
  push:
    branches:
      - automation/rebase-2506

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild PR 2506 on current upstream master
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "JamieLittle16"
          git config user.email "160879046+JamieLittle16@users.noreply.github.com"
          git remote add upstream https://github.com/Pumpkin-MC/Pumpkin.git || true
          git fetch upstream master
          git fetch origin archive/2506-noise-pre-rebase

          OLD_HEAD="$(git rev-parse origin/archive/2506-noise-pre-rebase)"
          OLD_PARENT="$(git rev-parse "${OLD_HEAD}^")"
          git diff --binary "$OLD_PARENT" "$OLD_HEAD" -- pumpkin-world > /tmp/old.patch
          sed -e 's#a/pumpkin-world/#a/crates/pumpkin-world/#g' \
              -e 's#b/pumpkin-world/#b/crates/pumpkin-world/#g' \
              -e 's#--- a/pumpkin-world/#--- a/crates/pumpkin-world/#g' \
              -e 's#+++ b/pumpkin-world/#+++ b/crates/pumpkin-world/#g' \
              /tmp/old.patch > /tmp/current-paths.patch

          git switch --detach upstream/master

          # Replay the non-conflicting benchmark/test/manifest portion. The two hot files
          # have both changed upstream, so merge their optimisation intent explicitly below.
          git apply --3way --index \
            --exclude='crates/pumpkin-world/src/generation/noise/router/chunk_density_function.rs' \
            --exclude='crates/pumpkin-world/src/generation/proto_chunk.rs' \
            /tmp/current-paths.patch

          python3 <<'PY'
          from pathlib import Path

          path = Path('crates/pumpkin-world/src/generation/noise/router/chunk_density_function.rs')
          s = path.read_text()

          replacements = [
              ('fn get_buffer(len: usize) -> Box<[f32]> {', 'fn get_buffer(len: usize) -> Vec<f32> {'),
              ('|| vec![0.0; len].into_boxed_slice(),', '|| vec![0.0; len],'),
              ('                buf.into_boxed_slice()\n', '                buf\n'),
              ('fn recycle_buffer(buf: Box<[f32]>) {', 'fn recycle_buffer(buf: Vec<f32>) {'),
              ('        pool.borrow_mut().push(Vec::from(buf));', '        pool.borrow_mut().push(buf);'),
              ('    pub(crate) start_buffer: Box<[f32]>,', '    pub(crate) start_buffer: Vec<f32>,'),
              ('    pub(crate) end_buffer: Box<[f32]>,', '    pub(crate) end_buffer: Vec<f32>,'),
              ('    pub(crate) const fn on_sampled_cell_corners(', '    pub(crate) fn on_sampled_cell_corners('),
              ('''        recycle_buffer(std::mem::replace(
              &mut self.start_buffer,
              Vec::new().into_boxed_slice(),
          ));
          recycle_buffer(std::mem::replace(
              &mut self.end_buffer,
              Vec::new().into_boxed_slice(),
          ));''', '''        recycle_buffer(std::mem::take(&mut self.start_buffer));
          recycle_buffer(std::mem::take(&mut self.end_buffer));'''),
              ('    pub(crate) cache: Box<[f32]>,', '    pub(crate) cache: Vec<f32>,'),
              ('''        recycle_buffer(std::mem::replace(
              &mut self.cache,
              Vec::new().into_boxed_slice(),
          ));''', '        recycle_buffer(std::mem::take(&mut self.cache));'),
              ('    cache: Box<[f32]>,', '    cache: Vec<f32>,'),
              ('            self.cache = vec![0.0; array.len()].into_boxed_slice();', '            self.cache = vec![0.0; array.len()];'),
              ('            cache: Box::new([]),', '            cache: Vec::new(),'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing density seam: {old!r}')
              s = s.replace(old, new, 1)

          needle = '''impl CellCache {
              #[must_use]
              pub fn new('''
          if needle not in s:
              raise SystemExit('missing CellCache impl seam')
          s = s.replace(
              needle,
              '''impl Drop for CellCache {
              fn drop(&mut self) {
                  recycle_buffer(std::mem::take(&mut self.cache));
              }
          }

          impl CellCache {
              #[must_use]
              pub fn new(''',
              1,
          )
          path.write_text(s)

          path = Path('crates/pumpkin-world/src/generation/proto_chunk.rs')
          s = path.read_text()

          setter_end = '''        let index = self.local_pos_to_block_index(local_x, local_y, local_z);
          self.flat_block_map[index] = block_state.id;
      }

      #[inline]
      #[must_use]
      pub fn get_biome'''
          direct = '''        let index = self.local_pos_to_block_index(local_x, local_y, local_z);
          self.flat_block_map[index] = block_state.id;
      }

      #[inline]
      fn set_block_state_direct(
          &mut self,
          local_x: i32,
          local_y: i32,
          local_z: i32,
          block_y: i16,
          block_state: &BlockState,
      ) {
          if !block_state.is_air() {
              let index = Self::local_position_to_height_map_index(local_x, local_z);
              self.maybe_update_surface_height_map(index, block_y);
              let block = BlockId::from_state_id(block_state.id);
              let blocks_movement = blocks_movement(block_state, block);
              if blocks_movement {
                  self.maybe_update_ocean_floor_height_map(index, block_y);
              }
              if blocks_movement || block_state.is_liquid() {
                  self.maybe_update_motion_blocking_height_map(index, block_y);
                  if !block.has_tag(tag::Block::MINECRAFT_LEAVES) {
                      self.maybe_update_motion_blocking_no_leaves_height_map(index, block_y);
                  }
              }
          }

          let index = self.local_pos_to_block_index(local_x, local_y, local_z);
          self.flat_block_map[index] = block_state.id;
      }

      #[inline]
      #[must_use]
      pub fn get_biome'''
          if setter_end not in s:
              raise SystemExit('missing direct-setter insertion seam')
          s = s.replace(setter_end, direct, 1)

          old = '''        let delta_y_step = 1.0 / v_count as f32;
          let delta_x_z_step = 1.0 / h_count as f32;

          noise_sampler.sample_start_density();'''
          new = '''        let delta_y_step = 1.0 / v_count as f32;
          let delta_x_z_step = 1.0 / h_count as f32;
          let bottom_y = self.bottom_y() as i32;
          let chunk_height = self.height() as i32;

          noise_sampler.sample_start_density();'''
          if old not in s:
              raise SystemExit('missing populate prelude seam')
          s = s.replace(old, new, 1)

          s = s.replace(
              '''            let sample_start_x = (self.start_cell_x(h_count) + cell_x) * h_count;
              let block_x_base = self.start_block_x() + cell_x * h_count;''',
              '''            let sample_start_x = (self.start_cell_x(h_count) + cell_x) * h_count;''',
              1,
          )
          s = s.replace(
              '''                let sample_start_z = (self.start_cell_z(h_count) + cell_z) * h_count;
                  let block_z_base = self.start_block_z() + cell_z * h_count;''',
              '''                let sample_start_z = (self.start_cell_z(h_count) + cell_z) * h_count;''',
              1,
          )

          old = '''                    for local_y in (0..v_count).rev() {
                          let block_y = sample_start_y + local_y;
                          noise_sampler.interpolate_y(local_y as f32 * delta_y_step);

                          for local_x in 0..h_count {
                              noise_sampler.interpolate_x(local_x as f32 * delta_x_z_step);
                              let block_x = block_x_base + local_x;

                              for local_z in 0..h_count {
                                  noise_sampler.interpolate_z(local_z as f32 * delta_x_z_step);
                                  let block_z = block_z_base + local_z;
'''
          new = '''                    for local_y in (0..v_count).rev() {
                          let block_y = sample_start_y + local_y;
                          let chunk_local_y = block_y - bottom_y;
                          if chunk_local_y < 0 || chunk_local_y >= chunk_height {
                              continue;
                          }
                          noise_sampler.interpolate_y(local_y as f32 * delta_y_step);

                          for local_x in 0..h_count {
                              let chunk_local_x = cell_x * h_count + local_x;
                              noise_sampler.interpolate_x(local_x as f32 * delta_x_z_step);

                              for local_z in 0..h_count {
                                  let chunk_local_z = cell_z * h_count + local_z;
                                  noise_sampler.interpolate_z(local_z as f32 * delta_x_z_step);
'''
          if old not in s:
              raise SystemExit('missing populate loop seam')
          s = s.replace(old, new, 1)

          old = '                            self.set_block_state(block_x, block_y, block_z, block_state);'
          new = '''                            self.set_block_state_direct(
                                  chunk_local_x,
                                  chunk_local_y,
                                  chunk_local_z,
                                  block_y as i16,
                                  block_state,
                              );'''
          if old not in s:
              raise SystemExit('missing set call seam')
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY

          cargo fmt --all
          git add -A
          git diff --cached --check
          cargo check -p pumpkin-world --all-targets
          cargo test -p pumpkin-world --lib generation::proto_chunk_test
          git commit -m "perf(world): optimize chunk noise generation and buffer allocations"
          git push --force origin HEAD:perf/noise-generation
