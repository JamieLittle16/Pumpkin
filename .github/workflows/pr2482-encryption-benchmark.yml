name: PR 2482 Java encryption benchmark

on:
  push:
    branches:
      - bench/pr-2482-inplace-2026-11-10

permissions:
  contents: read

jobs:
  compare:
    name: Four-way encryption implementation comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pinned source trees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/upstream" 10f1fde9367c827f168eaabdc8f343b1ce6f676c
          git worktree add --detach "$RUNNER_TEMP/candidate" eb57397997f1bbc306e03fb14eb4b85e8ae926a9
          git worktree add --detach "$RUNNER_TEMP/upstream_oct" 5b53f064af8708ba33fcaa533b81ca29a53a3310
          git worktree add --detach "$RUNNER_TEMP/legacy" 81ba76a113d859495feecad7c320df3aa50a0ac8
          for version in upstream candidate upstream_oct legacy; do
            git -C "$RUNNER_TEMP/$version" submodule update --init --recursive
            mkdir -p "$RUNNER_TEMP/$version/crates/pumpkin-protocol/examples"
            cp crates/pumpkin-protocol/examples/pr2482_encryption_bench.rs "$RUNNER_TEMP/$version/crates/pumpkin-protocol/examples/pr2482_encryption_bench.rs"
          done
          mkdir -p benchmark-results
          {
            echo "Upstream: 10f1fde9367c827f168eaabdc8f343b1ce6f676c"
            echo "New in-place PR: eb57397997f1bbc306e03fb14eb4b85e8ae926a9"
            echo "October upstream: 5b53f064af8708ba33fcaa533b81ca29a53a3310"
            echo "October buffered PR: 81ba76a113d859495feecad7c320df3aa50a0ac8
            echo "Runner: ubuntu-24.04, GitHub-hosted, shared virtual CPU"
            rustc --version
            cargo --version
            echo "Release profile; in-memory AsyncWrite, no TCP"
          } > benchmark-results/revisions.txt

      - name: Compile identical benchmark code against each revision
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pr2482-cargo-target"
          for version in upstream candidate upstream_oct legacy; do
            echo "::group::Release build of $version"
            (cd "$RUNNER_TEMP/$version" && cargo build --locked --release -p pumpkin-protocol --example pr2482_encryption_bench)
            cp "$CARGO_TARGET_DIR/release/examples/pr2482_encryption_bench" "benchmark-results/bench-$version"
            echo "::endgroup::"
          done

      - name: Measure paired throughput and output results
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, os, statistics, subprocess
          from collections import defaultdict
          from pathlib import Path
          output = Path("benchmark-results")
          cases = [(64, 60000), (1024, 15000), (16384, 1200), (65536, 320), (1048576, 20)]
          trials = 15
          records = []
          for trial in range(trials):
              print(f"Trial {trial+1}/{trials}", flush=True)
              for size, iterations in cases:
                  versions = ("upstream_oct", "legacy", "upstream", "candidate")
                  order = versions[trial % 4:] + versions[:trial % 4]
                  for version in order:
                      command = [str((output / f"bench-{version}").resolve()), str(size), str(iterations)]
                      raw = subprocess.check_output(command, text=True).strip()
                      sz, n, elapsed_ns, calls, bytes_written = map(int, raw.split(","))
                      row = {"trial": trial+1, "version": version, "size": sz, "iterations": n,
                             "elapsed_ns": elapsed_ns, "write_calls": calls,
                             "bytes_written": bytes_written, "ns_per_packet": elapsed_ns/n}
                      records.append(row)
                      print(f"  {version:10} {sz:8} bytes {elapsed_ns/n/1000:8.3f} us/pkt", flush=True)
          with (output / "raw.csv").open("w", newline="") as file:
              w = csv.DictWriter(file, fieldnames=list(records[0]))
              w.writeheader()
              w.writerows(records)
          groups = defaultdict(list)
          for row in records:
              groups[(row["size"], row["version"])].append(row["ns_per_packet"])
          summary = []
          print("\nMedians: October buffered vs October upstream; November in-place vs November upstream", flush=True)
          for size, _ in cases:
              medians = {version: statistics.median(groups[(size, version)])
                         for version in ("upstream_oct", "legacy", "upstream", "candidate")}
              dispersions = {version: statistics.median(
                  abs(x-medians[version]) for x in groups[(size, version)])
                  for version in medians}
              old_base = medians["upstream_oct"]
              old_buffer = medians["legacy"]
              new_base = medians["upstream"]
              new_inplace = medians["candidate"]
              old_gain = 100*(old_base-old_buffer)/old_base
              new_gain = 100*(new_base-new_inplace)/new_base
              base_shift = 100*(old_base-new_base)/old_base
              noise_pct = max(100*dispersions[version]/medians[version] for version in medians)
              row = {
                  "size": size,
                  "oct_upstream_us": round(old_base/1000, 4),
                  "oct_buffered_us": round(old_buffer/1000, 4),
                  "oct_buffered_gain_pct": round(old_gain, 3),
                  "nov_upstream_us": round(new_base/1000, 4),
                  "nov_inplace_us": round(new_inplace/1000, 4),
                  "nov_inplace_gain_pct": round(new_gain, 3),
                  "baseline_shift_pct": round(base_shift, 3),
                  "max_mad_pct": round(noise_pct, 3)
              }
              summary.append(row)
              print(
                  f"  {size:8} B: Oct baseline {old_base/1000:.3f} us -> buffered "
                  f"{old_buffer/1000:.3f} us ({old_gain:+.2f}%); Nov baseline "
                  f"{new_base/1000:.3f} us -> in-place {new_inplace/1000:.3f} us "
                  f"({new_gain:+.2f}%); baseline shift {base_shift:+.2f}%; "
                  f"MAD noise {noise_pct:.2f}%", flush=True)

          with (output / "summary.csv").open("w", newline="") as file:
              w = csv.DictWriter(file, fieldnames=list(summary[0]))
              w.writeheader()
              w.writerows(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write("# PR 2482 encryption microbenchmark (four-way)\n\n")
              file.write("Same release benchmark source and runner; 15 trials of each revision. "
                         "**Shared GitHub runner, in-memory output, no real network.**\n\n")
              file.write("| Bytes | Oct upstream (us) | Oct buffered (us) | Old gain | "
                         "Nov upstream (us) | Nov in-place (us) | New gain | "
                         "Baseline shift | MAD noise |\n")
              file.write("|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n")
              for row in summary:
                  file.write(
                      f"| {row['size']} | {row['oct_upstream_us']} | {row['oct_buffered_us']} "
                      f"| {row['oct_buffered_gain_pct']:+.3f}% | {row['nov_upstream_us']} "
                      f"| {row['nov_inplace_us']} | {row['nov_inplace_gain_pct']:+.3f}% "
                      f"| {row['baseline_shift_pct']:+.3f}% | {row['max_mad_pct']}% |\n")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-2482-four-way-encryption-benchmark
          path: |
            benchmark-results/raw.csv
            benchmark-results/summary.csv
            benchmark-results/revisions.txt
          retention-days: 14
          if-no-files-found: warn
