name: PR 2489 compression benchmark

on:
  push:
    branches:
      - 'bench/2489-*'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run compression benchmark
        run: cargo bench -p pumpkin-protocol --bench packet_compression_2489
